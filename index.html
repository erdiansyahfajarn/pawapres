<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Portal Warga Perumahan</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    nav a { margin-right: 15px; }
    .card { border: 1px solid #ddd; padding: 15px; margin-top: 15px; }
  </style>
</head>
<body>
  <h1>Portal Informasi Warga</h1>

  <nav>
    <a href="index.html">Beranda</a>
    <a href="rules.html">Tata Tertib</a>
    <a href="report.html">Lapor Masalah</a>
    <a href="contact.html">Kontak</a>
  </nav>

  <div class="card">
    <h3>📢 Pengumuman</h3>
    <ul>
      <li>Kerja bakti Minggu, 10:00 WIB</li>
      <li>Pembersihan saluran air blok B</li>
    </ul>
  </div>
  <div id="news"></div>
  <button id="more">Load more</button>
</body>
</html>

<script src="cms.js"></script>
<script>
let page = 1;

(async () => {
  let rows = await CMS.fetchSheet("Announcements");
  rows = sortByDate(rows, 3);

  const admin = CMS.isAdmin();
  const container = document.getElementById("news");

  function render() {
    paginate(rows, page).forEach(r => {
      if (!r.c[4]?.v && !admin) return;

      container.innerHTML += `
        <div class="card">
          <h3>${r.c[1].v}</h3>
          <small>${r.c[3].v}</small>
          <p>${r.c[2].v}</p>
          ${!r.c[4].v ? "<em>(Draft)</em>" : ""}
        </div>`;
    });
  }

  render();
  document.getElementById("more").onclick = () => {
    page++;
    render();
  };
})();
</script>
