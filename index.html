<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Portal Pawapres</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="shortcut icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
</head>
<body>
  <div class="container">
    <h2>🏘️ Portal Pawapres</h2>

    <nav>
      <a href="index.html">Beranda</a>
      <a href="rules.html">Tata Tertib</a>
      <a href="report.html">Lapor</a>
      <a href="contact.html">Kontak</a>
    </nav>

    <div id="news"></div>
    <button id="more" class="button">Load more</button>
  </div>

  <script src="cms.js"></script>
  <script>
    let page = 1;
    (async () => {
      let rows = await CMS.fetchSheet("Announcements");
      rows = sortByDate(rows, 3);

      const admin = CMS.isAdmin();
      const container = document.getElementById("news");

      function render() {
        paginate(rows, page).forEach(r => {
          if (!r.c[4]?.v && !admin) return;

          container.innerHTML += `
            <div class="card">
              <h3>${r.c[1].v}</h3>
              <small>${r.c[3].v}</small>
              <p>${r.c[2].v}</p>
              ${!r.c[4].v ? '<span class="badge">Draft</span>' : ''}
            </div>
          `;
        });
      }

      render();
      document.getElementById("more").onclick = () => {
        page++;
        render();
      };
    })();
  </script>
</body>
</html>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
