<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Portal Warga Perumahan</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    nav a { margin-right: 15px; }
    .card { border: 1px solid #ddd; padding: 15px; margin-top: 15px; }
  </style>
</head>
<body>
  <h1>Portal Informasi Warga</h1>

  <nav>
    <a href="index.html">Beranda</a>
    <a href="rules.html">Tata Tertib</a>
    <a href="report.html">Lapor Masalah</a>
    <a href="contact.html">Kontak</a>
  </nav>

  <div class="card">
    <h3>📢 Pengumuman</h3>
    <ul>
      <li>Kerja bakti Minggu, 10:00 WIB</li>
      <li>Pembersihan saluran air blok B</li>
    </ul>
  </div>
  <div class="card" id="news"></div>
</body>
</html>

<script>
const SHEET_ID = "1K_dUKV4kyLxkku2R2yxebY5m-o-xn3Ld5d76G3EwyuI";
const SHEET_NAME = "Announcements";

const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

fetch(URL)
  .then(res => res.text())
  .then(text => {
    const json = JSON.parse(text.substring(47).slice(0, -2));
    const rows = json.table.rows;

    const container = document.getElementById("news");

    rows.forEach(r => {
      const active = r.c[4]?.v;
      if (!active) return;

      const title = r.c[1]?.v;
      const content = r.c[2]?.v;
      const date = r.c[3]?.v;

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h3>${title}</h3>
        <small>${date}</small>
        <p>${content}</p>
      `;
      container.appendChild(card);
    });
  });
</script>
